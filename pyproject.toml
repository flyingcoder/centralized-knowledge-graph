[project]
name = "centralized-knowledge-graph"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "pydantic-settings>=2.6",
  "pyyaml>=6.0",
  "gitpython>=3.1",
  "mcp>=1.0"
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
